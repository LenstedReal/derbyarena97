name: Wreck Circuit Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          VER="4.7.2-stable"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${VER}/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o godot.zip

          unzip -oq godot.zip
          sudo install -m 0755 \
            Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${VER}/Godot_v4.7.2-stable_export_templates.tpz" \
            -o templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p /tmp/godot-templates
          unzip -oq templates.tpz -d /tmp/godot-templates

          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

          godot --version

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path wreck-circuit --editor --import --quit

      - name: Run smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path wreck-circuit \
            -s res://tests/smoke.gd

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wreck-circuit/build
          godot --headless --path wreck-circuit \
            --export-debug "Android" \
            wreck-circuit/build/wreck-circuit-debug.apk
          test -s wreck-circuit/build/wreck-circuit-debug.apk
          ls -lh wreck-circuit/build/wreck-circuit-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wreck-circuit-debug-apk
          path: wreck-circuit/build/wreck-circuit-debug.apk
          if-no-files-found: error
          retention-days: 14
